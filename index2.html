<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PremiacionesBA — Catálogo Slideshow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--gold:#b07d2a;--gold-l:#d4a843;--gold-pale:#fdf3dc;--ink:#1a1714;--ink2:#3d3830;--ink3:#7a7060;--ink4:#b0a898;--bg:#f8f7f4;--white:#fff;--wa:#25d366;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--ink2);font-family:'Outfit',sans-serif;font-weight:300;overflow-x:hidden;}

    /* HEADER */
    header{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(255,255,255,0.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,23,20,0.08);}
    .logo{display:flex;align-items:center;gap:0.6rem;text-decoration:none;}
    nav{display:flex;align-items:center;gap:1.4rem;}
    nav a{color:var(--ink3);text-decoration:none;font-size:0.78rem;font-weight:400;letter-spacing:0.04em;transition:color 0.2s;}
    nav a:hover{color:var(--gold);}
    .nav-wa{display:flex;align-items:center;gap:0.4rem;background:var(--wa);color:#fff!important;padding:0.44rem 0.9rem;border-radius:6px;font-weight:500!important;font-size:0.75rem!important;text-decoration:none;}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
    .hamburger span{display:block;width:22px;height:2px;background:var(--ink2);border-radius:2px;}
    .mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;z-index:99;background:rgba(255,255,255,0.97);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,23,20,0.08);flex-direction:column;padding:1rem 1.5rem 1.5rem;box-shadow:0 8px 24px rgba(26,23,20,0.08);}
    .mobile-menu.open{display:flex;}
    .mobile-menu a{color:var(--ink2);text-decoration:none;font-size:1rem;font-weight:400;padding:0.7rem 0;border-bottom:1px solid rgba(26,23,20,0.06);}
    .mobile-menu a:last-child{border-bottom:none;}
    .mobile-menu a:hover{color:var(--gold);}
    .mobile-menu .mob-wa{display:flex;align-items:center;gap:0.5rem;background:var(--wa);color:#fff!important;padding:0.7rem 1rem;border-radius:7px;margin-top:0.5rem;justify-content:center;font-weight:500;border-bottom:none!important;}

    /* HERO */
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8rem 2rem 4rem;text-align:center;background:linear-gradient(160deg,#fff 0%,var(--bg) 55%,var(--gold-pale) 100%);}
    .hero-p{font-size:0.96rem;color:var(--ink3);line-height:1.75;max-width:440px;margin-bottom:2.5rem;}
    .hero-cta{background:var(--ink);color:#fff;padding:0.82rem 2rem;border-radius:8px;text-decoration:none;font-size:0.85rem;font-weight:500;}

    /* CATALOG SECTION */
    .cat-section{padding:4rem 0 0;background:var(--bg);}

    /* FILTERS */
    .filters{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0 2rem 1.5rem;flex-wrap:wrap;}
    .fbtn{background:var(--white);border:1.5px solid rgba(26,23,20,0.1);color:var(--ink3);padding:0.42rem 1.1rem;border-radius:999px;font-family:'Outfit',sans-serif;font-size:0.74rem;cursor:pointer;transition:all 0.2s;box-shadow:0 1px 6px rgba(26,23,20,0.06);}
    .fbtn:hover{border-color:var(--gold);color:var(--gold);}
    .fbtn.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500;}
    .search-center{display:flex;justify-content:center;padding:0 2rem 2rem;}
    .search-box{position:relative;width:100%;max-width:360px;}
    .search-box input{width:100%;background:var(--white);border:1.5px solid rgba(26,23,20,0.12);border-radius:8px;color:var(--ink);padding:0.7rem 1rem 0.7rem 2.6rem;font-family:'Outfit',sans-serif;font-size:0.85rem;outline:none;box-shadow:0 1px 6px rgba(26,23,20,0.06);transition:border-color 0.2s;}
    .search-box input:focus{border-color:var(--gold);}
    .search-box svg{position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);color:var(--ink4);pointer-events:none;}

    /* SLIDESHOW */
    .slideshow{position:relative;max-width:1100px;margin:0 auto;padding:0 5rem;}
    .slide{display:none;animation:fadeIn 0.4s ease;}
    .slide.active{display:flex;gap:0;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(26,23,20,0.12);background:var(--white);}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    .slide-img{width:50%;background:var(--bg);position:relative;min-height:480px;}
    .slide-img img{width:100%;height:100%;object-fit:cover;}
    .slide-img-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.8rem;background:linear-gradient(135deg,var(--bg),#e8e4dc);}
    .slide-img-ph svg{opacity:0.3;}
    .slide-img-ph span{font-size:0.65rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink4);}
    .slide-badge{position:absolute;top:1rem;left:1rem;background:var(--gold);color:#fff;font-size:0.55rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:0.22rem 0.65rem;border-radius:999px;z-index:5;}
    .img-nav{display:none;} /* solo mobile */
    .img-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08);}
    .img-nav:disabled{opacity:0.2;cursor:not-allowed;}
    .img-nav-prev{left:0.6rem;}
    .img-nav-next{right:0.6rem;}
    .slide-info{flex:1;padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:center;}
    .slide-counter{font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink4);margin-bottom:0.5rem;}
    .slide-id{font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:0.15rem;}
    .slide-cat{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:0.6rem;}
    .slide-name{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:600;color:var(--ink);line-height:1.1;margin-bottom:0.8rem;letter-spacing:-0.01em;}
    .slide-dim{display:inline-block;background:var(--gold-pale);color:var(--gold);font-size:0.8rem;font-weight:500;padding:0.28rem 0.8rem;border-radius:5px;margin-bottom:1rem;}
    .slide-desc{font-size:0.86rem;color:var(--ink3);line-height:1.72;margin-bottom:2rem;flex:1;}
    .slide-wa{display:flex;align-items:center;justify-content:center;gap:0.55rem;background:var(--wa);color:#fff;padding:0.88rem 1.5rem;border-radius:8px;font-size:0.86rem;font-weight:500;text-decoration:none;box-shadow:0 4px 14px rgba(37,211,102,0.25);transition:opacity 0.2s,transform 0.2s;}
    .slide-wa:hover{opacity:0.88;transform:translateY(-2px);}
    .slide-note{margin-top:0.6rem;font-size:0.7rem;color:var(--ink4);text-align:center;}
    .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:var(--white);border:1.5px solid rgba(26,23,20,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);box-shadow:0 4px 16px rgba(26,23,20,0.1);transition:all 0.2s;z-index:10;}
    .nav-arrow:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-50%) scale(1.05);}
    .nav-prev{left:0;}
    .nav-next{right:0;}
    .nav-arrow:disabled{opacity:0.3;cursor:not-allowed;}
    .dots{display:flex;justify-content:center;gap:0.5rem;padding:2rem 2rem 1rem;flex-wrap:wrap;}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(26,23,20,0.15);cursor:pointer;transition:all 0.2s;border:none;flex-shrink:0;}
    .dot.active{background:var(--gold);width:24px;border-radius:4px;}
    .counter-bar{text-align:center;padding:0 2rem 3rem;font-size:0.72rem;color:var(--ink4);letter-spacing:0.05em;}
    .counter-bar strong{color:var(--gold);}
    .no-res{padding:4rem;text-align:center;color:var(--ink3);}
    .wa-float{position:fixed;bottom:1.5rem;right:1.5rem;z-index:400;width:52px;height:52px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:transform 0.2s;}
    .wa-float:hover{transform:scale(1.1);}
    footer{background:#0f0d0a;padding:1.8rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
    .fcopy{font-size:0.68rem;color:rgba(255,255,255,0.3);}
    @media(max-width:768px){
      header{padding:0 1rem;}
      nav a:not(.nav-wa){display:none;}
      .nav-wa{display:none;}
      .hamburger{display:flex;}
      .nav-arrow{display:none;}
      .img-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.85);backdrop-filter:blur(4px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);z-index:10;box-shadow:0 2px 12px rgba(26,23,20,0.15);}
      .img-nav:disabled{opacity:0.2;}
      .img-nav-prev{left:0.6rem;}
      .img-nav-next{right:0.6rem;}
      .slideshow{padding:0;}
      .slide.active{flex-direction:column;}
      .slide-img{width:100%;min-height:260px;max-height:360px;}
      .slide-info{padding:1.4rem 1.2rem 1.8rem;}
      .slide-name{font-size:1.5rem;}
      .slide-desc{margin-bottom:1.2rem;}
      .dots{padding:1.5rem 1rem 0.5rem;}
      .counter-bar{padding:0 1rem 2rem;}
    }
  </style>
</head>

let filt="todos",busq="",cur=0,list=[];
function waLink(p){return`https://wa.me/${WA}?text=${encodeURIComponent(`Hola PremiacionesBA! 👋 Consulto por *${p.n}* (${p.id.toUpperCase()}) — ${p.dim||''}. Gracias!`)}`;}
function render(){
  const t=busq.toLowerCase();
  list=P.filter(p=>(filt==="todos"||p.cat===filt)&&(!t||p.n.toLowerCase().includes(t)||p.id.includes(t)));
  cur=0;buildSlides();}
function buildSlides(){
  const g=document.getElementById("pgrid");
  const dotsEl=document.getElementById("dots");
  const cb=document.getElementById("counterBar");
  if(!list.length){g.innerHTML='<div class="no-res">No se encontraron productos.</div>';dotsEl.innerHTML="";cb.innerHTML="";document.getElementById("prevBtn").style.display="none";document.getElementById("nextBtn").style.display="none";return;}
  document.getElementById("prevBtn").style.display="";document.getElementById("nextBtn").style.display="";
  g.innerHTML=list.map((p,i)=>`
    <div class="slide ${i===0?'active':''}" id="slide-${i}">
      <div class="slide-img">
        ${p.img?`<img src="${p.img}" alt="${p.n}" loading="lazy">`:`<div class="slide-img-ph"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>Próximamente</span></div>`}
        ${p.b?`<div class="slide-badge">${p.b}</div>`:""}
        <button class="img-nav img-nav-prev" onclick="navigate(-1)" ${i===0?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="img-nav img-nav-next" onclick="navigate(1)" ${i===list.length-1?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="slide-info">
        <div class="slide-counter">${i+1} / ${list.length}</div>
        <div class="slide-id">${p.id.toUpperCase()}</div>
        <div class="slide-cat">${CATS[p.cat]||p.cat}</div>
        <div class="slide-name">${p.n}</div>
        ${p.dim?`<span class="slide-dim">📐 ${p.dim}</span>`:""}
        <p class="slide-desc">${p.d}</p>
        <a href="${waLink(p)}" target="_blank" class="slide-wa">${WA_SVG} Consultar precio por WhatsApp</a>
        <p class="slide-note">Te respondemos con precio y opciones de personalización.</p>
      </div>
    </div>
  `).join("");
  dotsEl.innerHTML=list.map((_,i)=>`<button class="dot ${i===0?'active':''}" onclick="goTo(${i})"></button>`).join("");
  updateCounter();}
function goTo(i){
  document.querySelectorAll(".slide").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
  const s=document.getElementById(`slide-${i}`);
  if(s){s.classList.add("active");document.querySelectorAll(".dot")[i].classList.add("active");}
  cur=i;updateCounter();}
function navigate(dir){
  const next=Math.min(Math.max(cur+dir,0),list.length-1);
  if(next!==cur)goTo(next);}
function updateCounter(){
  document.getElementById("counterBar").innerHTML=`Artículo <strong>${cur+1}</strong> de <strong>${list.length}</strong>`;
  document.getElementById("prevBtn").disabled=cur===0;
  document.getElementById("nextBtn").disabled=cur===list.length-1;}
function setF(c,btn){filt=c;document.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");render();}
function onSearch(){busq=document.getElementById("searchInput").value;render();}
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")navigate(-1);else if(e.key==="ArrowRight")navigate(1);});
render();
function toggleMenu(){document.getElementById("mobileMenu").classList.toggle("open");}
